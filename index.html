<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc, #e0f2fe);
        color: #172033;
    }

    .header {
        padding: 35px 20px;
        text-align: center;
        background: linear-gradient(135deg, #172554, #1e3a8a, #2563eb);
        color: white;
        box-shadow: 0 8px 25px rgba(30, 64, 175, 0.25);
    }

    .header h1 {
        font-size: 36px;
        font-weight: 800;
    }

    .header p {
        margin-top: 8px;
        font-size: 16px;
        opacity: 0.9;
    }

    .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .intro {
        text-align: center;
        margin-bottom: 30px;
    }

    .intro h2 {
        font-size: 27px;
        margin-bottom: 8px;
    }

    .intro p {
        color: #64748b;
        font-size: 15px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
        border: 1px solid #e2e8f0;
        transition: 0.25s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
    }

    .card-icon {
        width: 55px;
        height: 55px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 27px;
        margin-bottom: 18px;
        background: #dbeafe;
    }

    .card h3 {
        font-size: 22px;
        margin-bottom: 8px;
    }

    .card-description {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 22px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 7px;
        color: #334155;
    }

    input,
    select {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: white;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
    }

    input:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    select {
        cursor: pointer;
    }

    .btn {
        width: 100%;
        border: none;
        padding: 13px;
        border-radius: 10px;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn:hover {
        transform: translateY(-1px);
    }

    .btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
    }

    .theory-btn {
        background: #2563eb;
    }

    .lab-btn {
        background: #059669;
    }

    .project-btn {
        background: #7c3aed;
    }

    .message {
        margin-top: 15px;
        padding: 11px 13px;
        border-radius: 9px;
        font-size: 13px;
        display: none;
        line-height: 1.4;
    }

    .success {
        display: block;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
    }

    .error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
    }

    .loading {
        display: block;
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
    }

    .footer {
        text-align: center;
        padding: 30px 20px;
        color: #64748b;
        font-size: 13px;
    }

    @media (max-width: 950px) {
        .cards {
            grid-template-columns: 1fr;
        }

        .header h1 {
            font-size: 29px;
        }
    }

    @media (max-width: 500px) {
        .container {
            padding: 0 13px;
        }

        .card {
            padding: 22px;
        }

        .header {
            padding: 28px 15px;
        }
    }
</style>
